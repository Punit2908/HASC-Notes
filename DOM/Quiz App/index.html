<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Segoe UI", sans-serif;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            background:
                radial-gradient(circle at 20% 20%, #6dd5ed 0%, transparent 35%),
                radial-gradient(circle at 80% 80%, #7b61ff 0%, transparent 35%),
                linear-gradient(135deg, #101a3a, #172554, #312e81);

            color: white;
            perspective: 1200px;
        }

        h2 {
            font-size: 38px;
            margin-bottom: 25px;
            letter-spacing: 2px;

            color: #ffffff;

            text-shadow:
                0 2px 0 #777,
                0 4px 0 #555,
                0 8px 20px rgba(0, 0, 0, 0.5);

            animation: titleFloat 3s ease-in-out infinite;
        }

        #container {
            width: 550px;
            min-height: 400px;
            padding: 30px;

            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;

            text-align: center;

            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);

            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 25px;

            /* 3D depth */
            box-shadow:
                0 25px 50px rgba(0, 0, 0, 0.45),
                inset 0 1px 1px rgba(255, 255, 255, 0.3),
                inset 0 -10px 30px rgba(0, 0, 0, 0.15);

            transform: rotateX(2deg);
            transition: all 0.4s ease;
        }

        #container:hover {
            transform:
                rotateX(0deg) rotateY(0deg) translateY(-8px);

            box-shadow:
                0 35px 70px rgba(0, 0, 0, 0.55),
                inset 0 1px 1px rgba(255, 255, 255, 0.4);
        }

        .question {
            width: 100%;
            min-height: 80px;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 18px 25px;
            margin: 10px 0 20px;

            font-size: 20px;
            font-weight: 600;

            color: white;

            background: linear-gradient(145deg,
                    #6366f1,
                    #4338ca);

            border-radius: 15px;

            border: 1px solid rgba(255, 255, 255, 0.2);

            /* 3D button/card effect */
            box-shadow:
                0 8px 0 #292477,
                0 15px 25px rgba(0, 0, 0, 0.35);

            transform: translateY(-2px);
        }

        .answer {
            width: 80%;

            padding: 15px 20px;
            margin: 8px;

            font-size: 17px;
            font-weight: 500;

            color: #111827;

            background: linear-gradient(145deg,
                    #dbeafe,
                    #93c5fd);

            border-radius: 12px;

            cursor: pointer;

            border: none;

            /* 3D depth */
            box-shadow:
                0 6px 0 #3b82f6,
                0 10px 18px rgba(0, 0, 0, 0.3);

            transition:
                transform 0.15s ease,
                box-shadow 0.15s ease,
                background 0.2s ease;
        }

        .answer:hover {
            transform: translateY(-4px) scale(1.02);

            background: linear-gradient(145deg,
                    #eff6ff,
                    #bfdbfe);

            box-shadow:
                0 10px 0 #2563eb,
                0 18px 25px rgba(0, 0, 0, 0.35);
        }

        .answer:active {
            transform: translateY(3px);

            box-shadow:
                0 2px 0 #2563eb,
                0 5px 10px rgba(0, 0, 0, 0.25);
        }

        button {
            width: 180px;
            height: 55px;

            margin-top: 30px;

            border: none;
            border-radius: 15px;

            color: white;

            font-size: 19px;
            font-weight: bold;

            cursor: pointer;

            background: linear-gradient(145deg,
                    #06b6d4,
                    #2563eb);

            /* 3D button */
            box-shadow:
                0 7px 0 #164e9b,
                0 15px 25px rgba(0, 0, 0, 0.4);

            transition: all 0.15s ease;
        }

        button:hover {
            transform: translateY(-4px);

            box-shadow:
                0 11px 0 #164e9b,
                0 20px 30px rgba(0, 0, 0, 0.45);
        }

        button:active {
            transform: translateY(5px);

            box-shadow:
                0 2px 0 #164e9b,
                0 6px 12px rgba(0, 0, 0, 0.3);
        }

        .selected {
            color: white !important;

            background: linear-gradient(145deg,
                    #6cf43f,
                    #1b9109) !important;
            font-weight: bold !important;
            box-shadow:
                0 6px 0 #022907,
                0 12px 20px rgba(0, 0, 0, 0.4) !important;

            transform: translateY(-2px);
        }

        /* Floating animation */
        @keyframes titleFloat {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-6px);
            }
        }

        /* Mobile responsive */
        @media (max-width: 650px) {
            #container {
                width: 90%;
                min-height: 380px;
                padding: 20px;
            }

            .answer {
                width: 95%;
            }

            h2 {
                font-size: 30px;
            }
        }
    </style>

    <title>Document</title>
</head>

<body>
    <h2>Quiz App</h2>
    <div id="container">Press Start button to start the quiz....</div>
    <button>Start Quiz</button>

    <script src="script.js"></script>
</body>

</html>
