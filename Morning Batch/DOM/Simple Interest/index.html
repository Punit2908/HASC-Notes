<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body{
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: rgb(240, 240, 240);
            font-family: Arial, Helvetica, sans-serif;
            flex-direction: column;
        }
        form{
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        input{
            padding: 10px;
            border: 1px solid black;
            border-radius: 5px;
        }
        button{
            padding: 10px;
            border: 1px solid black;
            border-radius: 5px;
            background-color: rgb(0, 0, 0);
            color: white;
        }
        label{
            font-size: 20px;
        }
        #result{
            font-size: 30px;
        }
    </style>
    <title>Document</title>
</head>
<body>
    <form action="submit">
        <label for="principle">Enter the principle</label>
        <input type="number" id="principle" name="principle">
        <label for="interest">Enter the interest</label>
        <input type="number" id="interest" name="interest">
        <label for="time">Enter the time</label>
        <input type="number" id="time" name="time">
        <button type="submit">Calculate</button>
    </form>
    <p id="result"></p>
    <script src="script.js"></script>
</body>
</html>
