<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        font-size: 16px;
        /* line-height: 1.5; */
        display: flex;
        min-height: 100vh;
        align-items: center;
        justify-content: center;
        gap: 30px;
      }

      h2 {
        text-align: center;
      }

      form {
        max-width: 400px;
        margin: 20px 20px;
        padding: 20px;
        border: 1px solid #ccc;
      }

      label {
        display: block;
      }

      input[type="text"],
      input[type="number"],
      input[type="date"] {
        width: 100%;
        padding: 10px;
        margin: 10px 0;
      }

      button {
        background-color: #4caf50;
        color: white;
        padding: 14px 20px;
        margin: 8px 0;
        border: none;
        cursor: pointer;
      }

      button:hover {
        opacity: 0.8;
      }

      .container {
        display: flex;
        /* flex-wrap: wrap; */
        justify-content: center;
        align-items: center;
        gap: 20px;
        flex-direction: column;;
      }

      .credit {
        color: green;
      }
      .debit {
        color: red;
      }
    </style>
    <title>Document</title>
  </head>
  <body>
    
    <form action="submit">
      <h2>Expense Tracker</h2>
      <label for="name">Name:</label>
      <input type="text" id="name" name="name" /required><br />
      <label for="amount">Amount:</label>
      <input type="number" id="amount" name="amount" required/><br />
      <label for="date">Date:</label>
      <input type="date" id="date" name="date" /required><br />
      <button id="credit">Credit</button>
      <button id="debit">Debit</button>
    </form>
    <div class="inn"></div>
      <div class="out"></div>
    <div class="container">

      
    </div>
    <script src="script.js"></script>
  </body>
</html>
