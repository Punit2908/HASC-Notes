<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms</title>
</head>
<body>
    <form action="submit">
        <fieldset>
            <legend>User Form</legend>
        <label for="username">Enter your name </label>
        <input type="text" name="username" id="username" placeholder="Username">

        <input type="number">
        <input type="email">
        <input type="color">
        <input type="date">
        <input type="datetime">
        <input type="datetime-local">
        <input type="file">
        <input type="month">
        <input type="range" min="0" max="100" maxlength="100">
        <input type="password">

        <br>
        Select your languages <br>
        English
        <input type="checkbox">
        Hindi
        <input type="checkbox">
        Punjabi
        <input type="checkbox">
        <br>
        Male
        <input type="radio" name="gender" value="male">
        Female
        <input type="radio" name="gender" value="female">
        Binary
        <input type="radio" name="gender">
        Others
        <input type="radio" name="gender">

        <br>
        <input type="submit" value="submit">
        </fieldset>
    </form>
</body>
</html>
